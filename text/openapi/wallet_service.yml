methods:
  address_balance:
    get:
      summary: Returns the token balance of a given address and token
      operationId: wallet_address_balance
      tags:
        - wallet_service
      parameters:
        - name: address
          in: query
          description: Address to query for
          required: true
          schema:
            type: string
        - name: token
          in: query
          description: Token to get the balance
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token balance
          content:
            application/json:
              schema:
                $ref: "#/schemas/TokenBalance"
  address_history:
    get:
      summary: Returns the tx history for an address and token, or for its confidential tokens
      description: |
        Pass either `token`, for the history of that token, or `confidential=true`, for the
        transactions where the address has a FullyShielded output or input. The token and amount
        of those are hidden, so their entries have `token_id` and `balance` set to null.
      operationId: wallet_address_history
      tags:
        - wallet_service
      parameters:
        - name: address
          in: query
          description: Address to query for
          required: true
          schema:
            type: string
        - name: token
          in: query
          description: Token to filter for. Required unless `confidential` is true.
          required: false
          schema:
            type: string
        - name: confidential
          in: query
          description: Return the history of the address's confidential tokens instead of a token's
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Limit to the number of transactions on the response
          required: false
          schema:
            type: integer
            format: uint8
            maximum: 100
            minimum: 1
            default: 10
        - name: last_tx
          in: query
          description: Id of the last transaction of the previous page
          required: false
          schema:
            type: string
        - name: last_ts
          in: query
          description: Timestamp of the last transaction of the previous page
          required: false
          schema:
            type: integer
            format: uint64
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of the tx history
          content:
            application/json:
              schema:
                type: object
                required:
                  - has_next
                  - history
                properties:
                  has_next:
                    type: boolean
                  history:
                    type: array
                    items:
                      $ref: "#/schemas/TxHistoryEntry"
  address_tokens:
    get:
      summary: Returns the tokens of a given address
      operationId: wallet_address_tokens
      tags:
        - wallet_service
      parameters:
        - name: address
          in: query
          description: Address to query for
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Limit to the number of tokens on the response
          required: false
          schema:
            type: integer
            format: uint8
            maximum: 100
            minimum: 1
            default: 50
        - name: offset
          in: query
          description: Offset for the first tokens
          required: false
          schema:
            type: integer
            format: uint64
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: object
                required:
                    - total
                    - tokens
                    - has_confidential_activity
                    - has_hidden_token_activity
                properties:
                  total:
                    type: integer
                    format: uint64
                  has_confidential_activity:
                    type: boolean
                    description: The address has any shielded output or input
                  has_hidden_token_activity:
                    type: boolean
                    description: The address has a FullyShielded output or input, whose token is hidden
                  tokens:
                    type: object
                    maxProperties: 100
                    additionalProperties:
                      $ref: "#/schemas/TokenEntry"
schemas:
  TokenEntry:
    type: object
    required:
      - token_id
      - name
      - symbol
    properties:
      token_id:
        type: string
      name:
        type: string
      symbol:
        type: string
  TokenBalance:
    type: object
    required:
      - token_id
      - transactions
      - total_received
      - unlocked_balance
      - locked_balance
      - unlocked_authorities
      - locked_authorities
    properties:
      token_id:
        type: string
      transactions:
        type: integer
        format: uint64
        description: Transactions of the token the address is involved in, including ones with only shielded outputs or inputs
      total_received:
        type: integer
        format: uint64
      unlocked_balance:
        type: integer
        format: uint64
      locked_balance:
        type: integer
        format: uint64
      unlocked_authorities:
        type: integer
        format: uint64
      locked_authorities:
        type: integer
        format: uint64
  TxHistoryEntry:
    type: object
    required:
      - token_id
      - tx_id
      - balance
      - timestamp
      - version
      - height
    properties:
      token_id:
        type: string
        nullable: true
        description: Null on the confidential history
      tx_id:
        type: string
      balance:
        type: integer
        format: int64
        nullable: true
        description: Transparent balance change. Null on the confidential history
      timestamp:
        type: integer
        format: uint64
      version:
        type: integer
        format: uint8
      height:
        type: integer
        format: uint64
